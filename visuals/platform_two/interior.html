<html><head><style>
body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'DejaVu Sans',sans-serif}
.win{position:absolute;left:90px;top:170px;width:900px;height:780px;border-radius:70px;box-shadow:0 0 0 2400px #3a2e3d, inset 0 0 0 18px #c9b9a6, inset 0 0 0 30px #8f7f74, inset 0 0 60px 30px rgba(255,190,140,.25)}
.glare{position:absolute;left:140px;top:210px;width:300px;height:700px;background:linear-gradient(115deg,rgba(255,255,255,.07),rgba(255,255,255,0) 45%);border-radius:50px;filter:blur(18px)}
.panel{position:absolute;left:0;top:1000px;width:1080px;height:40px;background:#2a2130}
.table{position:absolute;left:-40px;top:1180px;width:1160px;height:800px;background:linear-gradient(#7a5a44,#5d4434);border-top:14px solid #9b7658;transform:perspective(900px) rotateX(18deg);transform-origin:top}
.lap{position:absolute;left:210px;top:1220px;width:660px;height:410px;background:#20232c;border-radius:22px 22px 6px 6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.scr{position:absolute;left:230px;top:1240px;width:620px;height:370px;background:#0f1320;border-radius:8px}
.base{position:absolute;left:150px;top:1630px;width:780px;height:34px;background:linear-gradient(#c3c6cf,#8c909b);border-radius:0 0 30px 30px}
.mug{position:absolute;left:900px;top:1500px;width:110px;height:130px;background:#e9e1d3;border-radius:8px 8px 34px 34px}
.mug:after{content:'';position:absolute;left:100px;top:28px;width:40px;height:56px;border:12px solid #e9e1d3;border-left:none;border-radius:0 30px 30px 0}
.ticket{position:absolute;left:40px;top:1560px;width:190px;height:84px;background:#f4ead2;transform:rotate(-8deg);border-radius:6px;font:700 22px 'DejaVu Sans Mono';color:#7a4b3a;padding:10px;box-sizing:border-box}
.title{position:absolute;left:0;width:1080px;top:1740px;text-align:center;color:#f6dcc0;font-size:62px;font-weight:700;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.sub{position:absolute;left:0;width:1080px;top:1828px;text-align:center;color:#d9b9a8;font-size:30px;letter-spacing:5px}
</style></head><body>
<div class="win"></div><div class="glare"></div><div class="panel"></div><div class="table"></div>
<div class="lap"></div><div class="scr"></div><div class="base"></div><div class="mug"></div>

</body></html>
